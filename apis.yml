name: Amp
description: >-
  Amp is an Ethereum-based digital collateral token (an ERC-20 fungible token
  extended with ERC-1400-style partitions and ERC-777-style operator semantics)
  designed to collateralize and instantly settle value transfer worldwide, most
  notably as the collateral layer behind Flexa payments. The AMP contract
  (0xff20817765cb7f73d4bde2e66e067e58d11095c2) supports partitioned staking,
  registered collateral managers, and operator authorization, and has been
  independently audited by ConsenSys Diligence (June 2020) and Trail of Bits
  (August 2020). Amp is smart-contract-only and exposes no REST/HTTP API; its
  published "API reference" documents the on-chain contract interface. The
  project is stewarded by the Acronym Foundation and was backed by Pantera
  Capital.
